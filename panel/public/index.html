    // ── Subdomain Panel (per admin, multiple subdomains) ────────────────────
    function SubdomainPanel() {
      const [admins, setAdmins] = React.useState([]);
      const [domain, setDomain] = React.useState("");
      const [loading, setLoading] = React.useState(true);
      const [saving, setSaving] = React.useState(null);
      const [adding, setAdding] = React.useState(null); // username being added to
      const [addValue, setAddValue] = React.useState("");
      const [msg, setMsg] = React.useState("");

      const fetchData = () => {
        fetch(`${API_BASE}/api/admin/subdomains`)
          .then(r => r.json())
          .then(d => { if (d.ok) { setAdmins(d.admins); setDomain(d.domain); } })
          .catch(() => {})
          .finally(() => setLoading(false));
      };
      React.useEffect(fetchData, []);

      const handleAdd = async (username) => {
        if (!addValue.trim()) return;
        setSaving(username);
        try {
          const r = await fetch(`${API_BASE}/api/admin/subdomains`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, subdomain: addValue.trim() }),
          });
          const d = await r.json();
          if (d.ok) { setMsg("ذخیره شد"); setTimeout(() => setMsg(""), 2000); fetchData(); }
        } catch {}
        setSaving(null); setAdding(null); setAddValue("");
      };

      const handleRemove = async (username, subdomain) => {
        setSaving(username);
        try {
          const r = await fetch(`${API_BASE}/api/admin/subdomain-remove`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, subdomain }),
          });
          const d = await r.json();
          if (d.ok) { setMsg("حذف شد"); setTimeout(() => setMsg(""), 2000); fetchData(); }
        } catch {}
        setSaving(null);
      };

      const prefixLabel = (p) => {
        if (p === null) return "همه";
        if (!p || p.length === 0) return "سایرین";
        return p.join("، ");
      };

      return (
        <div className="rounded-2xl border border-teal-500/20 bg-teal-500/5 backdrop-blur p-4 mt-4">
          <p className="text-xs text-teal-400/70 mb-1 font-bold">مدیریت ساب‌دامین ادمین‌ها</p>
          <p className="text-xs text-slate-500 mb-3">هر ادمین می‌تواند چند ساب‌دامین داشته باشد — هنگام ساخت اکانت انتخاب می‌شود</p>
          {msg && <div className="mb-2 text-xs px-3 py-1.5 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-400">{msg}</div>}
          {loading ? <p className="text-xs text-slate-500">در حال بارگذاری...</p> : (
            <div className="space-y-2">
              {admins.map(a => (
                <div key={a.username} className="rounded-xl border border-slate-700/30 bg-slate-800/30 px-3 py-2">
                  <div className="flex items-center justify-between mb-1">
                    <div className="flex items-center gap-2">
                      <span className="text-sm font-bold text-white">{a.username}</span>
                      <span className="text-xs text-slate-500">({prefixLabel(a.prefixes)})</span>
                    </div>
                    <button onClick={() => { setAdding(a.username); setAddValue(""); }}
                      className="text-xs px-2 py-1 rounded-lg bg-teal-500/10 border border-teal-500/20 text-teal-400 hover:bg-teal-500/20 transition">
                      تنظیم
                    </button>
                  </div>

                  {/* Show existing subdomains */}
                  {(a.subdomains && a.subdomains.length > 0) ? (
                    <div className="flex flex-wrap gap-1.5 mt-1.5">
                      {a.subdomains.map(sub => (
                        <div key={sub} className="flex items-center gap-1 bg-teal-500/10 border border-teal-500/20 rounded-lg px-2 py-1">
                          <span className="text-xs text-teal-300 font-bold" dir="ltr">{sub === "@" ? `${domain} (پیش‌فرض)` : `${sub}.${domain}`}</span>
                          <button onClick={() => handleRemove(a.username, sub)} disabled={saving === a.username}
                            className="text-xs text-red-400 hover:text-red-300 mr-0.5 disabled:opacity-50">✕</button>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <p className="text-xs text-slate-600 mt-1" dir="ltr">{domain} (پیش‌فرض)</p>
                  )}

                  {/* Add subdomain input */}
                  {adding === a.username && (
                    <div className="flex items-center gap-1 mt-2">
                      <div className="flex-1 flex items-center bg-slate-900/60 border border-teal-500/40 rounded-lg overflow-hidden">
                        <input type="text" value={addValue} onChange={e => setAddValue(e.target.value.toLowerCase().replace(/[^a-z0-9@-]/g, ""))}
                          placeholder="ساب‌دامین جدید"
                          className="flex-1 bg-transparent px-2 py-1 text-xs text-white focus:outline-none" dir="ltr" autoFocus
                          onKeyDown={e => { if (e.key === "Enter") handleAdd(a.username); if (e.key === "Escape") { setAdding(null); setAddValue(""); } }} />
                        <span className="text-xs text-slate-500 px-1">.{domain}</span>
                      </div>
                      <button onClick={() => handleAdd(a.username)} disabled={saving === a.username || !addValue.trim()}
                        className="text-xs px-2 py-1 rounded-lg bg-teal-500/20 border border-teal-500/30 text-teal-300 font-bold disabled:opacity-50">
                        {saving === a.username ? "..." : "افزودن"}
                      </button>
                      <button onClick={() => { setAdding(null); setAddValue(""); }}
                        className="text-xs px-2 py-1 rounded-lg bg-slate-700/40 border border-slate-600/30 text-slate-400">لغو</button>
                    </div>
                  )}
                </div>
              ))}
              <p className="text-xs text-slate-600 mt-1">پیش‌فرض: {domain} — ادمین‌هایی که ساب‌دامین ندارند از دامین اصلی استفاده می‌کنند</p>
            </div>
          )}

          {/* Backup Modal */}
          {showBackups && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={() => setShowBackups(false)}>
              <div className="bg-slate-800 border border-amber-500/30 rounded-2xl p-5 w-full max-w-md max-h-[70vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-bold text-amber-300 text-sm">بکاپ‌های دیتابیس x-ui</h3>
                  <button onClick={() => setShowBackups(false)} className="text-slate-400 hover:text-white text-lg">&times;</button>
                </div>
                {backupsLoading ? (
                  <div className="text-center py-6"><span className="w-5 h-5 border-2 border-amber-500 border-t-transparent rounded-full animate-spin inline-block"/></div>
                ) : backups.length === 0 ? (
                  <p className="text-sm text-slate-400 text-center py-4">هنوز بکاپی وجود ندارد</p>
                ) : (
                  <div className="space-y-2">
                    {backups.map(b => {
                      const d = new Date(b.mtime);
                      const dateStr = d.toLocaleDateString("fa-IR") + " " + d.toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" });
                      const sizeKB = (b.size / 1024).toFixed(0);
                      return (
                        <div key={b.name} className="flex items-center justify-between rounded-xl border border-slate-600/30 bg-slate-700/30 px-3 py-2">
                          <div>
                            <p className="text-xs text-slate-300 font-mono" dir="ltr">{b.name}</p>
                            <p className="text-xs text-slate-500">{dateStr} — {sizeKB} KB</p>
                          </div>
                          <button onClick={() => downloadBackup(b.name)} className="text-xs px-3 py-1.5 rounded-lg bg-amber-500/15 border border-amber-500/30 text-amber-300 hover:bg-amber-500/25 transition font-bold">دانلود</button>
                        </div>
                      );
                    })}
                  </div>
                )}
                <p className="text-xs text-slate-600 mt-3 text-center">بکاپ هر ۲ ساعت — نگهداری ۷۲ ساعت اخیر</p>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── Admin Dashboard ───────────────────────────────────────────────────────
    function AdminDashboard({ adminUser, clients, loading, onRefresh, onLogout, onBack, onDelete, onQR, onSub }) {
      const [deleteConfirm, setDeleteConfirm] = useState(null);
      const [deleting, setDeleting] = useState(null);
      const [showCreate, setShowCreate] = useState(false);
      const [loadingLinks, setLoadingLinks] = useState(null);
      const [search, setSearch] = useState("");
      const [renewEmail, setRenewEmail] = useState(null);
      const [renewMonths, setRenewMonths] = useState(1);
      const [renewing, setRenewing] = useState(false);
      const RENEW_PLANS = [{ v: 1, l: "۱ ماهه", gb: 30 }, { v: 2, l: "۲ ماهه", gb: 60 }, { v: 3, l: "۳ ماهه", gb: 90 }, { v: 6, l: "۶ ماهه", gb: 180 }];
      const [togglingEmail, setTogglingEmail] = useState(null);
      const [switchingInbound, setSwitchingInbound] = useState(null);

      const handleToggle = async (email, currentEnable) => {
        setTogglingEmail(email);
        try {
          const r = await fetch(`${API_BASE}/api/admin/client-toggle`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, enable: !currentEnable }),
          });
          const d = await r.json();
          if (d.ok) { onRefresh(); }
          else { alert(d.error || "خطا در تغییر وضعیت"); }
        } catch { alert("خطا در اتصال"); }
        setTogglingEmail(null);
      };

      const handleDelete = async (email) => {
        setDeleting(email);
        try {
          const r = await fetch(`${API_BASE}/api/admin/client`, {
            method: "DELETE", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });
          const d = await r.json();
          if (d.ok) { setDeleteConfirm(null); onRefresh(); }
          else { alert(d.error || "خطا در حذف"); }
        } catch { alert("خطا در اتصال"); }
        setDeleting(null);
      };

      const handleRenew = async (email) => {
        setRenewing(true);
        try {
          const r = await fetch(`${API_BASE}/api/admin/client-renew`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, months: renewMonths }),
          });
          const d = await r.json();
          if (d.ok) { setRenewEmail(null); onRefresh(); }
          else { alert(d.error || "خطا در تمدید حساب"); }
        } catch { alert("خطا در اتصال"); }
        setRenewing(false);
      };

      const handleSwitchInbound = async (email, currentRemark) => {
        const target = currentRemark === "N" ? "Arvan-CDN" : "N";
        setSwitchingInbound(email);
        try {
          const r = await fetch(`${API_BASE}/api/admin/client-switch-inbound`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, targetInbound: target }),
          });
          const d = await r.json();
          if (d.ok) { onRefresh(); }
          else { alert(d.error || "خطا در تغییر اینباند"); }
        } catch { alert("خطا در اتصال"); }
        setSwitchingInbound(null);
      };


      const handleLinks = async (email) => {
        setLoadingLinks(email);
        try {
          const r = await fetch(`${API_BASE}/api/admin/client-links?email=${encodeURIComponent(email)}`);
          const d = await r.json();
          if (d.ok) {
            if (d.links.length > 0) onQR(d.links[0], email);
          } else { alert(d.error || "خطا"); }
        } catch { alert("خطا در اتصال"); }
        setLoadingLinks(null);
      };

      const handleSub = async (email) => {
        setLoadingLinks("sub_" + email);
        try {
          const r = await fetch(`${API_BASE}/api/admin/client-links?email=${encodeURIComponent(email)}`);
          const d = await r.json();
          if (d.ok) { onSub(d.subUrl, d.links, email); }
          else { alert(d.error || "خطا"); }
        } catch { alert("خطا در اتصال"); }
        setLoadingLinks(null);
      };

      // Sales summary
      const totalSoldGB = clients.reduce((s, c) => s + c.total, 0) / 1073741824;
      const totalUsedBytes = clients.reduce((s, c) => s + (c.up || 0) + (c.down || 0), 0);
      const totalUsedGB = totalUsedBytes / 1073741824;

      // Filtered client list
      const filtered = (() => {
        const q = search.trim().toLowerCase();
        const tokenMatch = q ? q.match(/secretsub\/([a-z0-9]+)/) : null;
        const token = tokenMatch ? tokenMatch[1] : null;
        const list = clients.filter(c => {
          if (q) {
            // Match email or comment (e.g. a real customer name an admin noted in x-ui directly)
            // always; match subId only for sub-token searches (secretsub/xxx or 12+ hex chars)
            if (c.email.toLowerCase().includes(q)) return true;
            if (c.comment && c.comment.toLowerCase().includes(q)) return true;
            const subQuery = token || (/^[a-f0-9]{12,}$/.test(q) ? q : null);
            if (subQuery && c.subId && c.subId.toLowerCase().includes(subQuery)) return true;
            return false;
          }
          return true;
        });
        if (q) {
          // Sort by relevance: email starts-with first
          list.sort((a, b) => {
            const ae = a.email.toLowerCase(), be = b.email.toLowerCase();
            const aStart = ae.startsWith(q) ? 0 : 1;
            const bStart = be.startsWith(q) ? 0 : 1;
            if (aStart !== bStart) return aStart - bStart;
            return ae.localeCompare(be);
          });
        } else {
          // Sort: N inbound first, then Arvan-CDN; within each group newest first (reverse order)
          list.sort((a, b) => {
            const aIsN = a.remark === "N" ? 0 : 1;
            const bIsN = b.remark === "N" ? 0 : 1;
            if (aIsN !== bIsN) return aIsN - bIsN;
            return 0; // preserve original (reversed) order within same inbound
          });
          // Reverse within each inbound group for newest-first
          const nClients = list.filter(c => c.remark === "N").reverse();
          const cdnClients = list.filter(c => c.remark !== "N").reverse();
          list.length = 0;
          list.push(...nClients, ...cdnClients);
        }
        return list;
      })();

      return (
        <div style={{ animation: "fadeUp .3s ease-out" }}>
          {/* Header */}
          <div className="rounded-2xl border border-indigo-500/30 bg-indigo-500/5 backdrop-blur p-4 mb-4">
            <div className="flex items-center justify-between mb-3">
              <div>
                <p className="text-xs text-slate-400 mb-0.5">پنل مدیریت</p>
                <p className="font-black text-indigo-300">{adminUser.username}</p>
              </div>
              <div className="flex gap-2">
                <button onClick={onRefresh} disabled={loading} className="text-xs px-3 py-1.5 rounded-lg bg-slate-700/40 border border-slate-600/30 text-slate-300 hover:bg-slate-700/60 transition">
                  {loading ? <span className="w-3 h-3 border border-slate-500 border-t-slate-300 rounded-full animate-spin inline-block"/> : "بروزرسانی"}
                </button>
                <button onClick={onLogout} className="text-xs px-3 py-1.5 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 hover:bg-red-500/20 transition">خروج</button>
              </div>
            </div>

            {/* Sales summary */}
            {clients.length > 0 && (
              <div className="flex gap-3 justify-center">
                <div className="rounded-lg bg-slate-900/40 px-4 py-2 text-center">
                  <div className="text-xs text-slate-500">تعداد کاربران</div>
                  <div className="text-sm font-bold text-white">{toPersianNum(clients.length)}</div>
                </div>
                <div className="rounded-lg bg-slate-900/40 px-4 py-2 text-center">
                  <div className="text-xs text-slate-500">مصرف کل</div>
                  <div className="text-sm font-bold text-amber-400">{toPersianNum(totalUsedGB.toFixed(1))} گیگ</div>
                </div>
                {adminUser.pricePerGB > 0 && (
                  <div className="rounded-lg bg-slate-900/40 px-4 py-2 text-center">
                    <div className="text-xs text-slate-500">هزینه مصرف</div>
                    <div className="text-sm font-bold text-yellow-400">{toPersianNum(Math.round(totalUsedGB * adminUser.pricePerGB).toLocaleString())} تومان</div>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Search + Filter + Add button */}
          <div className="flex gap-2 mb-4">
            <div className="relative flex-1">
              <input type="text" value={search} onChange={e => setSearch(e.target.value)}
                placeholder="جستجوی کاربر..."
                className="w-full bg-slate-800/30 border border-slate-700/40 rounded-xl px-3.5 py-2.5 pr-9 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500/50 transition" dir="ltr" style={{ textAlign: "left" }} />
              {search && <button onClick={() => setSearch("")} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white transition text-lg leading-none" title="پاک کردن">&times;</button>}
            </div>
            <button onClick={() => setShowCreate(true)} className="px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-1.5 border border-emerald-500/30 bg-emerald-500/5 hover:bg-emerald-500/10 text-emerald-400 transition whitespace-nowrap">
              <span>+</span> افزودن
            </button>

                <div className="flex items-center justify-between">

                    <span className="text-sm font-bold text-white">{a.username}</span>

                    <p className="text-xs text-slate-500 mt-0.5">{prefixLabel(a.prefixes)}</p>
                  </div>
                  <div className="flex gap-1 items-center">
                    {!a.builtin ? (
                      removing === a.username ? (
                        <React.Fragment>
                          <button onClick={() => handleRemove(a.username)} className="text-xs px-2 py-1 rounded-lg bg-red-500/20 border border-red-500/30 text-red-300 font-bold">تأیید حذف</button>
                          <button onClick={() => setRemoving(null)} className="text-xs px-2 py-1 rounded-lg bg-slate-700/40 border border-slate-600/30 text-slate-400">لغو</button>
                        </React.Fragment>
                      ) : (
                        <button onClick={() => setRemoving(a.username)} className="text-xs px-2 py-1 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 hover:bg-red-500/20 transition">حذف</button>
                      )
                    ) : (
                      <span className="text-xs text-slate-600">پیش‌فرض</span>
                    )}
                  </div>
                </div>
                {/* Price per GB */}
                {!a.builtin && (
                  <div className="flex items-center gap-2 mt-1.5">
                    <span className="text-xs text-slate-500">قیمت هر گیگ:</span>
                    {editingPrice === a.username ? (
                      <div className="flex gap-1 items-center">
                        <input type="number" value={editPriceVal} onChange={e => setEditPriceVal(e.target.value)}
                          onKeyDown={e => { if (e.key === "Enter") handlePriceUpdate(a.username); if (e.key === "Escape") { setEditingPrice(null); setEditPriceVal(""); } }}
                          placeholder="تومان" className="w-20 bg-slate-900/60 border border-yellow-500/30 rounded-lg px-2 py-0.5 text-xs text-white focus:outline-none" dir="ltr" autoFocus />
                        <button onClick={() => handlePriceUpdate(a.username)} className="text-xs px-1.5 py-0.5 rounded-lg bg-yellow-500/20 border border-yellow-500/30 text-yellow-300 font-bold">✓</button>
                        <button onClick={() => { setEditingPrice(null); setEditPriceVal(""); }} className="text-xs px-1.5 py-0.5 rounded-lg bg-slate-700/40 border border-slate-600/30 text-slate-400">✕</button>
                      </div>
                    ) : (
                      <button onClick={() => { setEditingPrice(a.username); setEditPriceVal(String(a.pricePerGB || "")); }}
                        className="text-xs px-2 py-0.5 rounded-lg bg-yellow-500/10 border border-yellow-500/20 text-yellow-400 hover:bg-yellow-500/20 transition">
                        {a.pricePerGB > 0 ? `${toPersianNum(a.pricePerGB.toLocaleString())} تومان` : "تنظیم نشده"}
                      </button>
                    )}
                  </div>
                )}
              </div>
            ))}
          </div>

          {/* Add new admin */}
          <div className="rounded-xl border border-slate-700/30 bg-slate-800/20 p-3">
            <p className="text-xs text-slate-400 mb-2">افزودن ادمین جدید</p>
            <div className="flex gap-2 mb-2">
              <input type="text" value={newUser} onChange={e => setNewUser(e.target.value.toLowerCase())}
                placeholder="نام کاربری (لاتین)"
                className="flex-1 bg-slate-900/60 border border-slate-600/40 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-purple-500/50" dir="ltr" />
            </div>
            <div className="flex gap-2 mb-2">
              <input type="text" value={newPrefixes} onChange={e => setNewPrefixes(e.target.value)}
                placeholder="پیشوندها: A,B,C  (خالی = همه)"
                className="flex-1 bg-slate-900/60 border border-slate-600/40 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-purple-500/50" dir="ltr" />
            </div>
            <div className="flex gap-2 mb-2">
              <input type="number" value={newPrice} onChange={e => setNewPrice(e.target.value)}
                placeholder="قیمت هر گیگ (تومان)"
                className="flex-1 bg-slate-900/60 border border-slate-600/40 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-purple-500/50" dir="ltr" />
            </div>
            <p className="text-xs text-slate-600 mb-2">پیشوند = اول ایمیل کاربر. مثال: A,B → کاربران A1، B5. خالی = همه کاربران</p>
            <button onClick={handleAdd} disabled={adding || !newUser.trim()}
              className="w-full py-1.5 rounded-lg text-xs font-bold bg-purple-500/20 border border-purple-500/30 text-purple-300 hover:bg-purple-500/30 transition disabled:opacity-50">
              {adding ? "..." : "افزودن ادمین"}
            </button>
          </div>
        </div>
      );
    }

    // ── Main App ──────────────────────────────────────────────────────────────
    function App() {
      const urlToken = new URLSearchParams(window.location.search).get("sub");
      const [input, setInput] = useState(urlToken || "");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [client, setClient] = useState(null);
      const [serverOnline, setServerOnline] = useState(null);
      const [serverOffline, setServerOffline] = useState(false);
      const [checking, setChecking] = useState(false);
      const [migrating, setMigrating] = useState(false);
      const [migrateResult, setMigrateResult] = useState(null);
      const [copied, setCopied] = useState(false);
      const [adminData, setAdminData] = useState(null);
      const [subData, setSubData] = useState(null);
      const inputRef = useRef(null);
      const prevOnlineRef = useRef(null);

      // Admin state
      const [adminUser, setAdminUser] = useState(null);
      const [adminView, setAdminView] = useState(false);
      const [adminClients, setAdminClients] = useState([]);
      const [adminLoading, setAdminLoading] = useState(false);
      const [showAdminLogin, setShowAdminLogin] = useState(false);
      const [adminTab, setAdminTab] = useState("app");
      const [qrModal, setQrModal] = useState(null);
      const [subModal, setSubModal] = useState(null);

      const checkServer = useCallback(async () => {
        setChecking(true);
        try {
          const r = await fetch(`${API_BASE}/api/status`, { signal: AbortSignal.timeout(8000) });
          const d = await r.json();
          const wasOnline = prevOnlineRef.current;
          setServerOnline(d.online);
          setServerOffline(d.offline === true);
          if (wasOnline !== null && wasOnline !== d.online) {
            if (d.online) { sendNotification("استارلینک VPN", "سرور آنلاین شد ✅"); }
            else { sendNotification("استارلینک VPN", "سرور قطع شده است ⚠️"); }
          }
          prevOnlineRef.current = d.online;
        } catch {
          if (prevOnlineRef.current === true) { sendNotification("استارلینک VPN", "سرور قطع شده است ⚠️"); }
          setServerOnline(false); setServerOffline(true); prevOnlineRef.current = false;
        }
        setChecking(false);
      }, []);

      useEffect(() => {
        checkServer();
        const iv = setInterval(checkServer, 60000);
        return () => clearInterval(iv);
      }, [checkServer]);

      // Restore admin session on load
      useEffect(() => {
        fetch(`${API_BASE}/api/admin/clients`, { credentials: "include" })
          .then(r => r.ok ? r.json() : null)
          .then(d => {
            if (d && d.ok) {
              setAdminUser({ username: d.username, role: d.role, prefixes: d.prefixes, subdomains: d.subdomains || [], domain: d.domain || "", pricePerGB: d.pricePerGB || 0 });
              setAdminClients(d.clients);
              setAdminView(true);
            }
          })
          .catch(() => {});
      }, []);

      // Auto-search if ?sub=TOKEN is in URL
      useEffect(() => {
        if (urlToken) { fetchSub(urlToken); }
      }, []);

      const fetchAdminClients = async () => {
        setAdminLoading(true);
        try {
          const r = await fetch(`${API_BASE}/api/admin/clients`, { credentials: "include" });
          const d = await r.json();
          if (d.ok) {
            setAdminClients(d.clients);
            if (d.pricePerGB !== undefined) setAdminUser(prev => prev ? { ...prev, pricePerGB: d.pricePerGB } : prev);
          }
        } catch {}
        setAdminLoading(false);
      };

      const adminLogout = async () => {
        await fetch(`${API_BASE}/api/admin/logout`, { method: "POST", credentials: "include" }).catch(() => {});
        setAdminUser(null); setAdminView(false); setAdminClients([]);
      };

      const onAdminLoginSuccess = (user) => {
        setAdminUser(user);
        setShowAdminLogin(false);
        setAdminView(true);
        fetchAdminClients();
      };

      const fetchSub = async (token) => {
        setLoading(true); setError(""); setClient(null); setMigrateResult(null); setCopied(false); setAdminData(null); setSubData(null);
        try {
          const r = await fetch(`${API_BASE}/api/sub?token=${token}`, { signal: AbortSignal.timeout(15000) });
          const d = await r.json();
          if (d.error) { setError("خطا: " + d.error); } else { setSubData(d); }
        } catch { setError("خطا در اتصال به سرور"); }
        setLoading(false);
      };

      const search = async () => {
        const q = input.trim();
        if (!q) return;
        setLoading(true); setError(""); setClient(null); setMigrateResult(null); setCopied(false); setAdminData(null); setSubData(null);

        const subMatch = q.match(/\/secretsub\/([a-zA-Z0-9]+)/);
        if (subMatch) { await fetchSub(subMatch[1]); setLoading(false); return; }

        const ql = q.toLowerCase();
        const adminFilter = ql === "admin64" ? "all" : ql === "ramin" ? "ramin" : ql === "mostafa64" ? "mostafa" : ql === "danial" ? "danial" : null;
        if (adminFilter) {
          try {
            const r = await fetch(`${API_BASE}/api/admin`, { signal: AbortSignal.timeout(15000) });
            const d = await r.json();
            if (d.error) { setError("خطا: " + d.error); } else { setAdminData({ ...d, filter: adminFilter }); }
          } catch { setError("خطا در اتصال به سرور"); }
          setLoading(false);
          return;
        }

        try {
          let email;
          if (q.startsWith("vless://") || q.startsWith("ss://")) {
            const parsed = parseLink(q);
            if (!parsed) { setError("فرمت لینک نامعتبر است"); setLoading(false); return; }
            email = parsed.email;
          } else { email = q; }

          const url = `${API_BASE}/api/client?email=${encodeURIComponent(email)}`;
          const r = await fetch(url, { signal: AbortSignal.timeout(15000) });
          if (r.ok) {
            const d = await r.json();
            if (d.error) { setError("کاربری با این مشخصات یافت نشد"); }
            else { setClient(d); }
          } else { setError("کاربری با این مشخصات یافت نشد"); }
        } catch { setError("خطا در اتصال به سرور"); }
        setLoading(false);
      };

      const fallbackCopy = (text) => {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.cssText = "position:fixed;left:-9999px";
        document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      };

      const copyLink = (link) => {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(link).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
          } else { fallbackCopy(link); setCopied(true); setTimeout(() => setCopied(false), 2000); }
        } catch { fallbackCopy(link); setCopied(true); setTimeout(() => setCopied(false), 2000); }
      };

      const migrate = async () => {
        if (!client) return;
        setMigrating(true); setMigrateResult(null);
        try {
          const r = await fetch(`${API_BASE}/api/migrate`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: client.email }), signal: AbortSignal.timeout(30000),
          });
          const d = await r.json();
          setMigrateResult(d);
        } catch { setMigrateResult({ error: "خطا در اتصال به سرور" }); }
        setMigrating(false);
      };

      const canMigrate = client && !(client.remark === "Star" && client.port === 80);
      const used = client ? client.up + client.down : 0;
      const pct = client && client.total > 0 ? Math.min((used / client.total) * 100, 100) : 0;
      const remaining = client ? Math.max(0, client.total - used) : 0;
      const days = client ? daysLeft(client.expiryTime) : null;
      const isDanger = pct > 95; const isWarn = pct > 80;

      return (
        <div dir="rtl" className="min-h-screen text-white" style={{ fontFamily: "Vazirmatn, Tahoma, system-ui", background: "linear-gradient(160deg, #0a0e1a 0%, #111827 40%, #0f172a 100%)" }}>
          <div className="fixed inset-0 pointer-events-none" style={{ background: "radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.08) 0%, transparent 60%), radial-gradient(ellipse at 70% 80%, rgba(16,185,129,0.06) 0%, transparent 60%)" }} />

          <div className="relative z-10 max-w-md mx-auto px-4 py-8">

            {/* Logo & Title */}
            <div className="text-center mb-8">
              <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-3" style={{ background: "linear-gradient(135deg, #6366f1, #8b5cf6)", boxShadow: "0 8px 32px rgba(99,102,241,0.3)" }}>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              </div>
              <h1 className="text-xl font-black tracking-tight" style={{ background: "linear-gradient(to left, #c7d2fe, #e2e8f0)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>
                پنل کاربری
              </h1>
              <p className="text-slate-500 text-xs mt-1">مشاهده وضعیت اکانت و مصرف ترافیک</p>
            </div>


            {/* Admin Dashboard View: V2Ray configs (x-ui) or NahalVPN app accounts */}
            {adminView && adminUser && (
              <div className="grid grid-cols-2 gap-2 mb-4 p-1 rounded-2xl bg-slate-900/50 border border-slate-700/40">
                {[["app", "اپلیکیشن نهال"], ["xui", "کانفیگ‌های V2Ray"]].map(([k, l]) => (
                  <button key={k} onClick={() => setAdminTab(k)}
                    className={`py-2 rounded-xl text-sm font-bold transition ${adminTab === k ? "bg-indigo-600/30 text-indigo-200" : "text-slate-500 hover:text-slate-300"}`}>{l}</button>
                ))}
              </div>
            )}
            {adminView && adminUser && adminTab === "app" ? (
              <AppAccountsPanel key={adminUser.username} readonly={adminUser.role === "admin"} />
            ) : adminView && adminUser ? (
              adminUser.role === "admin" ? (
                <TrafficSummaryDashboard
                  adminUser={adminUser}
                  clients={adminClients}
                  loading={adminLoading}
                  onRefresh={fetchAdminClients}
                  onLogout={adminLogout}
                />
              ) : (
              <AdminDashboard
                adminUser={adminUser}
                clients={adminClients}
                loading={adminLoading}
                onRefresh={fetchAdminClients}
                onLogout={adminLogout}
                onBack={() => setAdminView(false)}
                onDelete={() => fetchAdminClients()}
                onQR={(link, email) => setQrModal({ link, email })}
                onSub={(subUrl, links, email) => setSubModal({ subUrl, links, email })}
              />
              )
            ) : null}

            {/* Admin login button (when not in admin view) */}
            {!adminView && (
              <div className="text-center mt-6">
                {adminUser ? (
                  <button onClick={() => { setAdminView(true); fetchAdminClients(); }}
                    className="text-xs text-indigo-400 hover:text-indigo-300 transition px-3 py-1.5 rounded-lg border border-indigo-500/20 bg-indigo-500/5">
                    بازگشت به پنل مدیریت ({adminUser.username})
                  </button>
                ) : (
                  <button onClick={() => setShowAdminLogin(true)}
                    className="text-xs text-slate-600 hover:text-slate-400 transition">
                    ورود مدیر
                  </button>
                )}
              </div>
            )}

          </div>

          {/* Modals */}
          {showAdminLogin && <AdminLoginModal onSuccess={onAdminLoginSuccess} onClose={() => setShowAdminLogin(false)} />}
          {qrModal && <QRModal link={qrModal.link} email={qrModal.email} onClose={() => setQrModal(null)} />}
          {subModal && <SubModal subUrl={subModal.subUrl} links={subModal.links} email={subModal.email} onClose={() => setSubModal(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
